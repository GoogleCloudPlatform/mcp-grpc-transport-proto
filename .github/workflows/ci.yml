name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@e58605a97d12d6fb2be1be9e4d23c2f8f53f1aa8 # v5.3.1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Generate protos
      run: uv run python generate.py

    - name: Build package
      run: uv build

    - name: Verify package installation and usage
      run: |
        # Run the example script to verify it works
        uv run python examples/basic_usage.py

  publish-pypi:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@e58605a97d12d6fb2be1be9e4d23c2f8f53f1aa8 # v5.3.1
      with:
        python-version: "3.12"

    - name: Build and check PyPI version
      id: check_version
      run: |
        uv sync
        uv run python generate.py
        uv build
        python3 -m pip install --upgrade pip twine packaging
        LOCAL_VER=$(python3 -c "import glob, os; whl=glob.glob('dist/*.whl')[0]; print(os.path.basename(whl).split('-')[1])")
        PYPI_VER=$(python3 -c "import json, urllib.request; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/mcp-grpc-transport-proto/json').read())['info']['version'])")
        echo "Local: $LOCAL_VER, PyPI: $PYPI_VER"
        if python3 -c "from packaging.version import Version; exit(0 if Version('$LOCAL_VER') > Version('$PYPI_VER') else 1)"; then
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Authenticate to Google Cloud (OSS Exit Gate)
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

    - name: Set up Cloud SDK
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

    - name: Clean up stale releases from staging repo
      run: |
        # clean up stale releases from staging repo
        packages=$(gcloud artifacts packages list \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="mcp-grpc-transport-proto--pypi" \
            --format="value(name)" 2>/dev/null)

        echo "${packages}" | xargs -r -I {} sh -c '
            package_name=$(basename "{}")
            echo "Deleting package: $package_name..."
            gcloud artifacts packages delete "{}" \
                --project="\'"oss-exit-gate-prod"\'" \
                --location="\'"us"\'" \
                --repository="\'mcp-grpc-transport-proto--pypi\'" \
                --quiet
        '

    - name: Stage to OSS Exit Gate and upload manifest
      if: steps.check_version.outputs.should_publish == 'true'
      run: |
        python3 -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/mcp-grpc-transport-proto--pypi/" \
          -u oauth2accesstoken \
          -p "$(gcloud auth print-access-token)" \
          dist/*
        echo '{"publish_all": true}' > manifest.json
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/mcp-grpc-transport-proto/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
